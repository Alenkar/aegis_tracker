profile: tiny_uav
template_size: 128
search_size: 256
local_feature_stride: 4
local_feature_dim: 128
base_search_factor: 18.0
adaptive_search_min_factor: 2.5
adaptive_search_scale_ref: 32.0
min_crop_side: 144
max_crop_side: 768
topk_tracking: 5
topk_lost: 12
center_nms_radius_px: 10.0
center_nms_max_keep_tracking: 5
center_nms_max_keep_lost: 8

train:
  data: ""
  out: runs/train
  epochs: 50
  batch: 8
  lr: 0.0001
  pairs_per_epoch: 20000
  max_gap: 20
  num_workers: 4
  dataloader_timeout: 60
  ckpt: ""

tensorboard:
  enabled: true
  log_dir: ""

validation:
  enabled: true
  data: ""
  every: 1
  max_sequences: 5
  max_frames_per_sequence: 100

clearml:
  enabled: false
  project_name: AegisTrack
  task_name: train
  queue_name: default
  remote: false
  dataset_id: ""

datasets:
  root: /home/neuro/dataset/UAV-TRACKING
  sources:
    anti_uav_rgbt:
      enabled: true
      path: Anti-UAV-RGBT
      modalities: [infrared, visible]
    anti_uav410:
      enabled: true
      path: Anti-UAV410
      modalities: []
    cst_anti_uav:
      enabled: true
      path: CST-AntiUAV
      modalities: []
    anti_uav_4th:
      enabled: true
      path: The_4th_Anti-UAV_Dataset_Test
      modalities: []

center_sigma_min: 1.5
corr_response_weight: 0.45
train_search_jitter: 0.30
train_motion_jitter: 0.10
train_scale_jitter: 0.25
blur_aug_enabled: true
blur_aug_prob: 0.15
motion_blur_prob: 0.75
motion_blur_kernel_min: 3
motion_blur_kernel_max: 11
blur_horizontal_prob: 0.35
blur_vertical_prob: 0.35
blur_diagonal_prob: 0.20
blur_angle_jitter_deg: 10.0
blur_bbox_expand_parallel_factor: 0.30
blur_bbox_expand_parallel_max_px: 6.0
blur_bbox_expand_perp_px: 1.0
blur_aug_max_bbox_expand_ratio: 1.6

tracking_score_thr: 0.45
recovery_score_thr: 0.45
uetrack_lost_frames: 2
crop_lost_gain: 2.2
uetrack_max_tracking_jump_factor: 4.0
uetrack_max_tracking_jump_min_px: 48.0
